<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:334px;height:710px;background:#FFFFFF;" width="334px" height="710px" viewBox="0 0 334 710" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><ellipse cx="183.277" cy="25" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="95.276" y="55" width="176.001" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="105.276" y="76.139" fill="#000" font-size="12" textLength="156.001" font-family="Hiragino Sans GB">查询当前审批，默认返回焦点</text><polygon points="114.001,108.969,252.553,108.969,264.553,120.969,252.553,132.969,114.001,132.969,102.001,120.969,114.001,108.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="114.001" y="124.777" fill="#000" font-size="11" textLength="138.552" font-family="Hiragino Sans GB">明确决定且无其他pending?</text><text x="91.001" y="118.375" fill="#000" font-size="11" font-family="Hiragino Sans GB">是</text><text x="264.553" y="118.375" fill="#000" font-size="11" font-family="Hiragino Sans GB">否</text><rect x="16" y="142.969" width="152.001" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="164.107" fill="#000" font-size="12" textLength="132.001" font-family="Hiragino Sans GB">保存决定命令，调用服务</text><rect x="234.552" y="142.969" width="80" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="244.552" y="164.107" fill="#000" font-size="12" textLength="60" font-family="Hiragino Sans GB">不产生决定</text><ellipse cx="274.553" cy="207.938" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="274.553" cy="207.938" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><r