notes:
  - "当前实现是正式 Agent Kernel 代码基线；内存持久化等未完成能力仍按里程碑推进。"
  - "本次未改变 Agent Kernel 对外职责，因此总体 Draw.io 不变。"
  - "Kernel 作为 Pi monorepo 独立 workspace；Adapter 与 CLI 对齐 0.84.4，并由规范化契约隔离。"
  - "模型来源、Provider 和 Model 由严格 YAML 选择；系统提示词由版本化 Prompt Catalog 统一管理。"
  - "全部可调运行参数进入严格 YAML；契约判别值和绝对安全上限保持不可配置。"
  - "时间点统一为 UTC；IANA 时区和 locale 随 RequestContext 显式传播，系统时钟只经 TimePort 使用。"
  - "公共契约、配置、源码目录、脚本和文档统一使用正式 Kernel/Runtime/Application 命名。"
  - "ACR-2026-0007仅解释已批准历史基线；当前工作区包含ACR-2026-0012系统Flow实现及其他未基线化变更。"
  - "ACR-2026-0008 是唯一后续设计口径：Agent Kernel System 是限界上下文，AgentRun 是核心执行聚合根，Runtime 是受 Scheduler 管理的可重建执行服务。"
  - "ACR-2026-0008 的步骤一结论已被 ACR-2026-0009 修订；五步批准前不得迁移代码，也不得把候选基线标记为 active。"
  - "ACR-2026-0009 修改系统职责边界：Kernel 不拥有 Multi-agent 团队逻辑，Session 不对应进程，FlowEngine 为无状态推进算法；因此步骤一重新评审。"
  - "ACR-2026-0012中用户已确认系统四态、业务外置、循环与框架关联调度；后续决定由SessionManager内部SubSessionCoordinator统一管理Session级Fork/Join/Reduce/Parent唤醒，FE仅执行单Flow，不扩大为独立服务。"
  - "ACR-2026-0017冻结Session单活Run前置：每个Session仅0..1 ActiveRunBinding且不保存Run集合；历史Run和Attempt接管归RunRegistry。进程内对象模型已完成首个迁移切片，持久CAS、回执、outbox/inbox与RunRegistry绑定校验仍未实现。"
  - "ACR-2026-0010 将候选资料重组为总设计、七层设计和层内组件设计；旧混合文档仅在 governance/archive 中保留为非规范历史。"
  - "候选架构包含 20 张正式 PlantUML：4 张系统图、7 张层图、3 张组件图、1 张契约图、4 张场景图和 1 张部署图；theme 文件不计入架构图数量。"
