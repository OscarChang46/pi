notes:
  - "当前实现是正式 Agent Kernel 代码基线；内存持久化等未完成能力仍按里程碑推进。"
  - "本次未改变 Agent Kernel 对外职责，因此总体 Draw.io 不变。"
  - "Kernel 作为 Pi monorepo 独立 workspace；Adapter 与 CLI 对齐 0.84.4，并由规范化契约隔离。"
  - "模型来源、Provider 和 Model 由严格 YAML 选择；系统提示词由版本化 Prompt Catalog 统一管理。"
  - "全部可调运行参数进入严格 YAML；契约判别值和绝对安全上限保持不可配置。"
  - "时间点统一为 UTC；IANA 时区和 locale 随 RequestContext 显式传播，系统时钟只经 TimePort 使用。"
  - "公共契约、配置、源码目录、脚本和文档统一使用正式 Kernel/Runtime/Application 命名。"
  - "当前代码仍按 ACR-2026-0007 运行；该历史模型不再作为后续设计文档的候选口径。"
  - "ACR-2026-0008 是唯一后续设计口径：Agent Kernel System 是限界上下文，AgentRun 是核心执行聚合根，Runtime 是受 Scheduler 管理的可重建执行服务。"
  - "ACR-2026-0008 的步骤一结论已被 ACR-2026-0009 部分重开；五步批准前不得迁移代码，也不得把候选基线标记为 active。"
  - "ACR-2026-0009 修改系统职责边界：Kernel 不拥有 Multi-agent 团队逻辑，Session 不对应进程，FlowEngine 为无状态推进算法；因此步骤一重新评审。"
